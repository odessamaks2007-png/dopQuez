<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>What do I have in my fridge?</title>
    <link rel="stylesheet" href="Dop.css">
</head>
<body>

    <div class="container">
        <h1>What do I have in my fridge?</h1>

        <div class="grid">
            <div class="card" onclick="toggleZoom(this)">
                <img src="Food_C247-128.png" alt="Pepper">
                <p>Pepper</p>
            </div>
            <div class="card" onclick="toggleZoom(this)">
                <img src="Food_C240-128.png" alt="Apple">
                <p>Apple</p>
            </div>
            <div class="card" onclick="toggleZoom(this)">
                <img src="Food_C217-128.png" alt="Cheese">
                <p>Cheese</p>
            </div>
            <div class="card" onclick="toggleZoom(this)">
                <img src="Food_C245-128.png" alt="Corn">
                <p>Corn</p>
            </div>
            <div class="card" onclick="toggleZoom(this)">
                <img src="Food_C239-128.png" alt="Mushroom">
                <p>Mushroom</p>
            </div>
            <div class="card" onclick="toggleZoom(this)">
                <img src="Food_C238-128.png" alt="Garlic">
                <p>Garlic</p>
            </div>
            <div class="card" onclick="toggleZoom(this)">
                <img src="Food_C225-128.png" alt="Beef">
                <p>Beef</p>
            </div>
            <div class="card" onclick="toggleZoom(this)">
                <img src="Food_C205-128.png" alt="Fish">
                <p>Fish</p>
            </div>
            <div class="card" onclick="toggleZoom(this)">
                <img src="Food_C203-128.png" alt="Eggs">
                <p>Eggs</p>
            </div>
            <div class="card" onclick="toggleZoom(this)">
                <img src="Food_C235-128.png" alt="Coriander">
                <p>Coriander</p>
            </div>
        </div>

        <div class="footer-text">
            ... that's all ...
        </div>
    </div>

    <script>
        function toggleZoom(card) {
            document.querySelectorAll('.card').forEach(c => {
                if (c !== card) c.classList.remove('active');
            });
            card.classList.toggle('active');
        }
    </script>

</body>
</html>
